<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prompt Box Component - Dash Social GDS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-page: #f9fbff;
    --bg-default: #fff;
    --bg-utility: #e8ecf4;
    --bg-action: #000;
    --border-light: #e8ecf4;
    --text-primary: #000;
    --text-subtle: #686a7a;
    --text-knockout: #fff;
    --vision-ai: #693abb;
    --rounded-sm: 10px;
    --rounded-md: 20px;
    --rounded-lg: 30px;
    --rounded-full: 9999px;
    --shadow-a04: rgba(45,69,104,0.04);
    --shadow-a15: rgba(45,69,104,0.15);
  }

  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Inter', sans-serif;
    font-feature-settings: 'cv13' 1, 'cv12' 1, 'cv11' 1, 'cv01' 1;
    background: var(--bg-page);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
  }

  /* Outer container */
  .prompt-box-wrapper {
    background: var(--bg-default);
    border: 1px solid var(--border-light);
    border-radius: var(--rounded-md);
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    max-width: 1008px;
    width: 100%;
    box-shadow:
      0px 2px 4px 0px var(--shadow-a04),
      -4px 8px 16px -8px var(--shadow-a15),
      4px 8px 16px -8px var(--shadow-a15);
  }

  /* Header row */
  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .header-icon {
    width: 28px;
    height: 28px;
    color: var(--vision-ai);
    flex-shrink: 0;
  }

  h2.header-heading {
    font-size: 24px;
    font-weight: 500;
    line-height: 28px;
    color: var(--text-primary);
  }

  .vision-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: var(--vision-ai);
    border-radius: var(--rounded-full);
    height: 24px;
    padding: 0 8px;
    flex-shrink: 0;
  }

  .vision-chip-icon {
    width: 14px;
    height: 14px;
    color: var(--text-knockout);
    flex-shrink: 0;
  }

  .vision-chip-text {
    font-size: 12px;
    font-weight: 400;
    color: var(--text-knockout);
    white-space: nowrap;
  }

  /* Widget section */
  .widget-section {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* Tabs */
  .tabs-container {
    display: inline-flex;
    gap: 4px;
    background: var(--bg-default);
    border: 1px solid var(--border-light);
    border-radius: var(--rounded-full);
    padding: 4px;
    align-self: flex-start;
  }

  .tab {
    height: 32px;
    padding: 0 8px;
    border-radius: var(--rounded-full);
    font-size: 12px;
    font-weight: 400;
    border: none;
    cursor: pointer;
    background: transparent;
    color: var(--text-subtle);
    font-family: 'Inter', sans-serif;
    font-feature-settings: 'cv13' 1, 'cv12' 1, 'cv11' 1, 'cv01' 1;
    transition: background 0.15s, color 0.15s;
    display: flex;
    align-items: center;
  }

  .tab.active {
    background: var(--bg-utility);
    color: var(--text-primary);
  }

  .tab:not(.active):hover {
    background: rgba(232, 236, 244, 0.5);
  }

  /* Inner prompt box */
  .prompt-box-inner {
    background: var(--bg-default);
    border: 1px solid var(--border-light);
    border-radius: var(--rounded-md);
  }

  .prompt-box-content {
    background: var(--bg-default);
    border-radius: var(--rounded-md);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    min-height: 128px;
    height: 166px;
    max-height: 296px;
  }

  /* Text area */
  .text-area {
    flex: 1;
    min-height: 16px;
    font-size: 12px;
    font-family: 'Inter', sans-serif;
    font-feature-settings: 'cv13' 1, 'cv12' 1, 'cv11' 1, 'cv01' 1;
    color: var(--text-primary);
    outline: none;
    overflow-y: auto;
    line-height: 1.5;
    word-break: break-word;
  }

  .text-area:empty::before {
    content: attr(data-placeholder);
    color: var(--text-subtle);
    pointer-events: none;
  }

  /* Uploaded image — GDS Simple Media Thumbnail (Size=S, 48–103px) */
  .image-preview-container {
    display: none;
    position: relative;
    width: 56px;
    height: 56px;
    flex-shrink: 0;
    cursor: pointer;
    isolation: isolate;
  }

  .image-preview-container.visible {
    display: block;
  }

  /* _Object Thumbnail: rounded-sm-md (16px), overflow clip */
  .image-thumbnail {
    position: relative;
    width: 56px;
    height: 56px;
    border-radius: 16px;
    overflow: hidden;
    z-index: 1;
  }

  /* Base thumbnail image: object-cover */
  .image-preview {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* GDS Hover Backdrop Blur: backdrop-blur-md (25px), color-backdrop-blur-media-card */
  .image-hover-overlay {
    position: absolute;
    inset: 0;
    background: rgba(45, 69, 104, 0.25);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    opacity: 0;
    transition: opacity 0.2s ease-in-out;
    pointer-events: none;
  }

  /* GDS Hover Thumbnail: object-contain (fitted view on hover) */
  .image-hover-thumbnail {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    opacity: 0;
    transition: opacity 0.2s ease-in-out;
    pointer-events: none;
  }

  .image-preview-container:hover .image-hover-overlay,
  .image-preview-container:hover .image-hover-thumbnail {
    opacity: 1;
  }

  /* GDS Extra Small Icon Button — remove: white bg, 1px border-danger (#d32f2f), top-right -4px */
  .image-delete-btn {
    position: absolute;
    top: -4px;
    right: -4px;
    width: 24px;
    height: 24px;
    border-radius: var(--rounded-full);
    background: var(--bg-default);
    border: 1px solid #d32f2f;
    color: #d32f2f;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
    opacity: 0;
    transition: opacity 0.2s ease-in-out;
    z-index: 2;
  }

  .image-preview-container:hover .image-delete-btn {
    opacity: 1;
  }

  .image-delete-btn:hover {
    background: #fef2f2;
  }

  /* Bottom bar */
  .bottom-bar {
    display: flex;
    gap: 16px;
    align-items: center;
  }

  .upload-btn {
    width: 32px;
    height: 32px;
    border-radius: var(--rounded-full);
    border: none;
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s;
  }

  .upload-btn:hover:not(.disabled) {
    background: var(--bg-utility);
  }

  .upload-btn.disabled {
    opacity: 0.3;
    cursor: default;
    pointer-events: none;
  }

  .upload-btn svg {
    width: 16px;
    height: 16px;
  }

  .canned-prompts {
    display: flex;
    gap: 8px;
    overflow: hidden;
    flex: 1;
    min-width: 0;
  }

  .canned-pill {
    background: var(--bg-utility);
    height: 32px;
    padding: 0 16px;
    border-radius: var(--rounded-full);
    font-size: 12px;
    font-weight: 500;
    color: var(--text-primary);
    border: none;
    cursor: pointer;
    white-space: nowrap;
    font-family: 'Inter', sans-serif;
    font-feature-settings: 'cv13' 1, 'cv12' 1, 'cv11' 1, 'cv01' 1;
    display: flex;
    align-items: center;
    transition: background 0.15s;
    flex-shrink: 0;
  }

  .canned-pill:hover {
    background: #dce1eb;
  }

  .action-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--vision-ai);
    height: 32px;
    padding: 0 16px;
    border-radius: var(--rounded-full);
    font-size: 12px;
    font-weight: 500;
    color: var(--text-knockout);
    border: none;
    cursor: default;
    opacity: 0.3;
    white-space: nowrap;
    font-family: 'Inter', sans-serif;
    font-feature-settings: 'cv13' 1, 'cv12' 1, 'cv11' 1, 'cv01' 1;
    transition: opacity 0.15s;
    flex-shrink: 0;
  }

  .action-btn.active {
    opacity: 1;
    cursor: pointer;
  }

  .action-btn.active:hover {
    opacity: 0.85;
  }

  .action-btn svg {
    width: 16px;
    height: 16px;
  }

  /* Hidden file input */
  .file-input {
    display: none;
  }
</style>
</head>

<div class="prompt-box-wrapper">
  <!-- Header row -->
  <div class="header-row">
    <div class="header-left">

              <path d="M2.5 6H9.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </button>
          <!-- GDS _Object Thumbnail -->
          <div class="image-thumbnail">
            <img class="image-preview" id="imagePreview" src="" alt="Uploaded image">
            <div class="image-hover-overlay"></div>
            <img class="image-hover-thumbnail" id="imageHoverThumbnail" src="" alt="">

        <!-- Bottom bar -->
        <div class="bottom-bar">

            </svg>
          </button>

          <!-- Canned prompts -->
          <div class="canned-prompts" id="cannedPrompts">
            <button class="canned-pill">Female talent with high reel interaction</button>
            <button class="canned-pill">US Creators aged 25-34</button>
            <button class="canned-pill">High Engagement Creators</button>
          </div>

          <!-- Action button -->
          <button class="action-btn" id="actionBtn">

<!-- Hidden file input -->
<input type="file" class="file-input" id="fileInput" accept="image/*">

<script>
  const tabData = {
    creator: {
      heading: 'Discover Creators',
      placeholder: 'Search for exact @handles or describe what you\'re looking for like audience demographics, location, reel engagement rate, etc....',
      prompts: [
        'Female talent with high reel interaction',
        'US Creators aged 25-34',
        'High Engagement Creators'
      ],
      button: 'Explore Creators'
    },
    content: {
      heading: 'Discover Content',
      placeholder: 'Try describing keywords, hashtags, or mentions to discover relevant creator content',
      prompts: [
        'Content mentioning my brand in the last 7 days',
        'Neutral content that mentions my competitor'
      ],
      button: 'Explore Content'
    }
  };

  const heading = document.getElementById('heading');
  const textArea = document.getElementById('textArea');
  const cannedPrompts = document.getElementById('cannedPrompts');
  const actionBtn = document.getElementById('actionBtn');
  const actionBtnText = document.getElementById('actionBtnText');
  const uploadBtn = document.getElementById('uploadBtn');
  const fileInput = document.getElementById('fileInput');
  const imagePreviewContainer = document.getElementById('imagePreviewContainer');
  const imagePreview = document.getElementById('imagePreview');
  const imageHoverThumbnail = document.getElementById('imageHoverThumbnail');
  const imageDeleteBtn = document.getElementById('imageDeleteBtn');
  const tabs = document.querySelectorAll('.tab');

  let currentTab = 'creator';

  function switchTab(tab) {
    currentTab = tab;
    const data = tabData[tab];

    // Update tabs
    tabs.forEach(t => {
      t.classList.toggle('active', t.dataset.tab === tab);
    });

    // Update heading
    heading.textContent = data.heading;

    // Update placeholder (only visible when text area is empty)
    textArea.setAttribute('data-placeholder', data.placeholder);
    updateActionButton();

    // Update canned prompts
    cannedPrompts.innerHTML = '';
    data.prompts.forEach(prompt => {
      const pill = document.createElement('button');
      pill.className = 'canned-pill';
      pill.textContent = prompt;
      pill.addEventListener('click', () => fillPrompt(prompt));
      cannedPrompts.appendChild(pill);
    });

    // Update button text
    actionBtnText.textContent = data.button;
  }

  function fillPrompt(text) {
    textArea.textContent = text;
    updateActionButton();
    textArea.focus();
    // Move cursor to end
    const range = document.createRange();
    const sel = window.getSelection();
    range.selectNodeContents(textArea);
    range.collapse(false);
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function updateActionButton() {
    const hasText = textArea.textContent.trim().length > 0;
    actionBtn.classList.toggle('active', hasText);
  }

  // Tab click handlers
  tabs.forEach(tab => {
    tab.addEventListener('click', () => switchTab(tab.dataset.tab));
  });

  // Text area input
  textArea.addEventListener('input', updateActionButton);

  // Upload button
  uploadBtn.addEventListener('click', () => fileInput.click());

  // File selected
  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = (ev) => {
        imagePreview.src = ev.target.result;
        imageHoverThumbnail.src = ev.target.result;
        imagePreviewContainer.classList.add('visible');
        uploadBtn.classList.add('disabled');
      };
      reader.readAsDataURL(file);
    }
    // Reset so the same file can be re-selected
    fileInput.value = '';
  });

  // Delete image
  imageDeleteBtn.addEventListener('click', () => {
    imagePreview.src = '';
    imageHoverThumbnail.src = '';
    imagePreviewContainer.classList.remove('visible');
    uploadBtn.classList.remove('disabled');
  });

  // Initialize canned prompt click handlers
  document.querySelectorAll('.canned-pill').forEach(pill => {
    pill.addEventListener('click', () => fillPrompt(pill.textContent));
  });
</script>
